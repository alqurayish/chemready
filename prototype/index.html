<title>ChemReady Prototype</title>
<style>
/* Layout: public website, then the app: glass top navigation (desktop and tablet), menu button
   on phones. No sidebar. Review and record screens split fields | source page.
   Colours from docs/design/tokens.css. Single light theme by design (see 03-design-system.md). */
:root {
  color-scheme: light;
  --color-page: #F8FAFC;
  --color-surface: #FFFFFF;
  --color-surface-subtle: #F1F5F9;
  --color-text: #0F172A;
  --color-text-secondary: #475569;
  --color-text-muted: #58677D;
  --color-border: #E2E8F0;
  --color-border-input: #8391A7;
  --color-primary: #1D4ED8;
  --color-primary-hover: #1E40AF;
  --color-primary-soft: #DBEAFE;
  --color-focus: #2563EB;
  --color-verified-text: #166534;
  --color-verified-bg: #DCFCE7;
  --color-verified-icon: #16A34A;
  --color-review-text: #92400E;
  --color-review-bg: #FEF3C7;
  --color-review-icon: #D97706;
  --color-missing-text: #991B1B;
  --color-missing-bg: #FEE2E2;
  --color-missing-icon: #DC2626;
  --color-passed-text: #334155;
  --color-passed-bg: #F1F5F9;
  --color-danger: #B91C1C;
  --color-highlight-bg: #BFDBFE;
  --color-highlight-border: #1D4ED8;
  --color-inverse: #FFFFFF;
  --color-pdf-paper: #FFFFFF;
  --color-pdf-desk: #E8ECF1;
  --color-overlay: rgba(15, 23, 42, 0.40);

  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, "Liberation Mono", monospace;
  --text-xs: 12px; --text-sm: 13px; --text-base: 14px; --text-md: 16px; --text-lg: 22px; --text-xl: 28px; --text-hero: 40px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px;
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 14px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 4px 14px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.06);
  --shadow-lg: 0 20px 48px rgba(15, 23, 42, 0.18), 0 2px 6px rgba(15, 23, 42, 0.08);
  --topnav-height: 52px;
  --row-height: 40px;
  --content-max: 1280px;
  --banner-height: 30px;
  --glass-bg: rgba(255, 255, 255, 0.62);
  --glass-bg-strong: rgba(255, 255, 255, 0.78);
  --glass-nav: rgba(255, 255, 255, 0.70);
  --glass-menu: #FFFFFF;
  --glass-card: rgba(255, 255, 255, 0.58);
  --glass-card-blur: saturate(180%) blur(20px);
  --glass-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.9);
  --glass-card-shadow: 0 0 0 1px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04), 0 10px 30px rgba(30, 64, 175, 0.07);
  --glass-border: rgba(255, 255, 255, 0.75);
  --glass-edge: rgba(15, 23, 42, 0.08);
  --glass-blur: saturate(180%) blur(18px);
  --wash-1: #DBEAFE;
  --wash-2: #E0E7FF;
  --wash-3: #ECFDF5;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--color-text);
  background: #FFFFFF; /* plain white page, by request: no colour wash */
  font-family: var(--font-sans); font-size: var(--text-base); line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
table, input, select, button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
h1, h2, h3 { line-height: 1.25; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
a { color: var(--color-primary); }
svg.icon { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* Prototype banner */
.proto-banner {
  display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4); align-items: center; justify-content: space-between;
  padding: 6px var(--space-4); background: var(--color-text); color: var(--color-inverse); font-size: var(--text-xs);
  position: sticky; top: 0; z-index: 25; min-height: var(--banner-height);
}
.proto-banner button { background: transparent; border: 1px solid currentColor; color: var(--color-inverse); border-radius: var(--radius-sm); padding: 1px var(--space-2); font-size: var(--text-xs); }

/* Brand */
.brand { display: flex; align-items: center; gap: var(--space-2); background: none; border: 0; padding: 0; text-align: left; }
.brand-mark { width: 16px; height: 16px; border: 2px solid var(--color-primary); transform: rotate(45deg); border-radius: 3px; flex: none; margin: 0 3px; }
.brand-name { font-size: var(--text-md); font-weight: 600; letter-spacing: -0.01em; }

/* ---------- Landing ---------- */
.landing { min-height: calc(100% - var(--banner-height)); }
.landing:focus { outline: none; } /* focus moves here on page change for screen readers; no visible ring needed */
.glass { background: var(--glass-card); -webkit-backdrop-filter: var(--glass-card-blur); backdrop-filter: var(--glass-card-blur); border: 1px solid var(--glass-border); box-shadow: var(--glass-highlight), var(--glass-card-shadow); }
.l-wrap { max-width: 1120px; margin: 0 auto; padding-inline: var(--space-5); }
.l-top-wrap { position: sticky; top: calc(var(--banner-height) + 12px); z-index: 10; padding-inline: var(--space-4); margin-top: 12px; }
.l-top.glass { background: rgba(255, 255, 255, 0.86); }
.l-top { max-width: 760px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: 6px 6px 6px 16px; border-radius: 16px; }
.l-top .btn { height: 32px; }
.l-top nav { display: flex; align-items: center; gap: 2px; }
.l-hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: var(--space-7); align-items: center; padding-block: var(--space-7) var(--space-8); }
.eyebrow { margin: 0 0 var(--space-4); }
.eyebrow-pill { display: inline-block; font-size: var(--text-xs); font-weight: 600; color: var(--color-primary-hover); background: rgba(219, 234, 254, 0.8); border: 1px solid rgba(29, 78, 216, 0.15); border-radius: 999px; padding: 3px 10px; }
.l-hero h1 { font-size: var(--text-hero); font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; }
.l-hero .lead { font-size: 17px; color: var(--color-text-secondary); margin: var(--space-4) 0 var(--space-5); max-width: 34em; }
.l-hero .hint { font-size: var(--text-sm); color: var(--color-text-muted); margin-top: var(--space-3); }
.preview { border-radius: 18px; overflow: hidden; padding: 6px; }
.preview-inner { border-radius: 13px; overflow: hidden; background: var(--color-surface); border: 1px solid var(--color-border); }
.preview-bar { display: flex; gap: 6px; padding: 10px var(--space-4); border-bottom: 1px solid var(--color-border); background: var(--color-page); align-items: center; }
.preview-bar i { width: 10px; height: 10px; border-radius: 50%; background: #CBD5E1; display: block; }
.preview-bar span { margin-left: var(--space-2); font-size: var(--text-xs); color: var(--color-text-muted); }
.preview-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.preview-fields { border-right: 1px solid var(--color-border); }
.preview-paper { background: var(--color-pdf-desk); padding: var(--space-3); }
.preview-paper .paper { min-height: 0; padding: var(--space-4); font-size: var(--text-xs); box-shadow: var(--shadow-sm); }
.l-section { padding-block: var(--space-6); }
.l-section h2 { font-size: var(--text-lg); font-weight: 600; margin-bottom: var(--space-5); }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-4); list-style: none; margin: 0; padding: 0; counter-reset: step; }
.steps li { counter-increment: step; }
.steps li::before { content: counter(step); display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--color-primary-soft); color: var(--color-primary); font-weight: 600; font-size: var(--text-sm); margin-bottom: var(--space-3); }
.steps h3, .principles h3 { font-size: var(--text-base); font-weight: 600; margin-bottom: var(--space-1); }
.steps p, .principles p { margin: 0; color: var(--color-text-secondary); font-size: var(--text-sm); }
.principles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); }
.principle { padding: var(--space-5); border-radius: 16px; }
.principle svg.icon { color: var(--color-primary); margin-bottom: var(--space-3); width: 22px; height: 22px; }
.l-cta { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: center; justify-content: space-between; padding: var(--space-5); border-radius: 16px; }
.l-cta p { margin: 0; color: var(--color-text-secondary); }
.l-foot { padding-block: var(--space-5) var(--space-6); font-size: var(--text-xs); color: var(--color-text-muted); display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); justify-content: space-between; border-top: 1px solid rgba(15, 23, 42, 0.08); }
.about { display: flex; gap: var(--space-5); align-items: center; justify-content: space-between; padding: var(--space-5) var(--space-6); border-radius: 16px; }
.about h2 { font-size: var(--text-md); margin: 0 0 var(--space-1); }
.about p { margin: 0; color: var(--color-text-secondary); max-width: 46em; }
.about .about-label { font-size: var(--text-xs); font-weight: 600; color: var(--color-text-muted); margin-bottom: var(--space-1); }
.about-mark { width: 56px; height: 56px; border-radius: 14px; background: rgba(219, 234, 254, 0.8); display: grid; place-items: center; flex: none; }
.about-mark .brand-mark { width: 22px; height: 22px; border-width: 3px; }

/* ---------- App shell: horizontal top navigation, no sidebar ---------- */
.app { min-height: calc(100% - var(--banner-height)); display: flex; flex-direction: column; }
.topnav { position: sticky; top: calc(var(--banner-height) + 12px); z-index: 15; padding-inline: var(--space-4); margin-top: 12px; }
.topnav-shell {
  width: fit-content; max-width: 100%; margin: 0 auto; border-radius: 18px;
  background: var(--glass-nav); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-border); box-shadow: var(--glass-highlight), var(--glass-card-shadow);
}
.topnav-inner { height: var(--topnav-height); padding: 0 6px 0 16px; display: flex; align-items: center; gap: var(--space-4); }
.topnav .brand { flex: none; }
.brand-tag { font-size: 11px; font-weight: 500; color: var(--color-text-muted); border: 1px solid var(--color-border); border-radius: 999px; padding: 0 7px; line-height: 18px; margin-left: 2px; }
.nav { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; }
.nav button {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 11px; border-radius: 11px !important;
  background: none; border: 0; border-radius: var(--radius-md);
  color: var(--color-text-secondary); font-weight: 500; white-space: nowrap;
  transition: background-color 150ms, color 150ms;
}
.nav button svg.icon { width: 17px; height: 17px; }
.nav button:hover { background: rgba(15, 23, 42, 0.05); color: var(--color-text); }
.nav button[aria-current="page"] { background: var(--color-surface); color: var(--color-primary); box-shadow: 0 0 0 1px rgba(29, 78, 216, 0.14), 0 2px 8px rgba(29, 78, 216, 0.12); }
.count { font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 999px; background: rgba(15, 23, 42, 0.06); color: var(--color-text-secondary); font-variant-numeric: tabular-nums; line-height: 17px; }
.count-review { background: var(--color-review-bg); color: var(--color-review-text); }
.topnav-right { display: flex; align-items: center; gap: 6px; margin-left: var(--space-2); flex: none; position: relative; padding-left: var(--space-3); border-left: 1px solid rgba(15, 23, 42, 0.08); }
.mode-chip { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--color-text-secondary); padding: 0 10px; height: 26px; border-radius: 999px; background: rgba(15, 23, 42, 0.04); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-verified-icon); flex: none; }
.profile-btn { display: inline-flex; align-items: center; gap: var(--space-2); height: 36px; padding: 0 8px 0 4px; background: none; border: 0; border-radius: 999px; transition: background-color 150ms; }
.profile-btn:hover, .profile-btn[aria-expanded="true"] { background: rgba(15, 23, 42, 0.05); }
.profile-btn .name { font-weight: 500; font-size: var(--text-sm); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.profile-btn svg.icon { width: 14px; height: 14px; color: var(--color-text-muted); transform: rotate(-90deg); }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--color-primary); color: var(--color-inverse); display: grid; place-items: center; font-size: 11px; font-weight: 600; flex: none; letter-spacing: 0.02em; }
.avatar-lg { width: 56px; height: 56px; font-size: 18px; }
.account-meta { min-width: 0; flex: 1; line-height: 1.35; }
.account-meta strong { display: block; font-size: var(--text-sm); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.account-meta span { display: block; font-size: var(--text-xs); color: var(--color-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu {
  position: absolute; top: calc(100% + 8px); right: 0; width: 248px; z-index: 30;
  /* Solid: the menu sits inside the blurred top bar, and browsers cannot blur twice. */
  background: var(--glass-menu);
  border: 1px solid var(--glass-border); box-shadow: 0 0 0 1px var(--glass-edge), var(--shadow-lg);
  border-radius: var(--radius-lg); padding: 6px; animation: pop 140ms ease-out;
}
.menu-head { display: flex; gap: var(--space-3); align-items: center; padding: var(--space-2) var(--space-2) var(--space-3); }
.menu button { display: flex; width: 100%; gap: var(--space-2); align-items: center; background: none; border: 0; border-radius: 7px; padding: 7px var(--space-2); text-align: left; font-size: var(--text-sm); }
.menu button:hover { background: rgba(15, 23, 42, 0.06); }
.menu button svg.icon { width: 16px; height: 16px; color: var(--color-text-secondary); }
.menu hr { border: 0; border-top: 1px solid var(--color-border); margin: 6px 4px; }
.menu-foot { font-size: 11px; color: var(--color-text-muted); padding: 6px var(--space-2) 2px; }
.menu-toggle { display: none; width: 36px; height: 36px; border: 0; background: none; border-radius: var(--radius-md); place-items: center; color: var(--color-text); }
.menu-toggle:hover { background: rgba(15, 23, 42, 0.05); }
.mobile-menu { border-top: 1px solid var(--glass-edge); padding: var(--space-2) 6px 6px; display: grid; gap: 2px; min-width: min(320px, calc(100vw - 32px)); }
.mobile-menu button { display: flex; align-items: center; gap: var(--space-3); height: 42px; padding: 0 var(--space-3); border: 0; background: none; border-radius: var(--radius-md); font-weight: 500; color: var(--color-text-secondary); text-align: left; }
.mobile-menu button[aria-current="page"] { background: var(--color-surface); color: var(--color-primary); box-shadow: 0 0 0 1px var(--glass-edge); }
.mobile-menu .count { margin-left: auto; }
.mobile-menu hr { border: 0; border-top: 1px solid var(--color-border); margin: var(--space-2) 0; width: 100%; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(0.98); } to { opacity: 1; transform: none; } }

.sample-strip { max-width: var(--content-max); margin: var(--space-4) auto 0; width: calc(100% - 2 * var(--space-5)); display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); align-items: center; justify-content: space-between; padding: var(--space-2) var(--space-4); border-radius: var(--radius-lg); background: rgba(219, 234, 254, 0.75); border: 1px solid rgba(29, 78, 216, 0.12); color: var(--color-primary-hover); font-size: var(--text-sm); }
.main { width: 100%; max-width: var(--content-max); margin: 0 auto; padding: var(--space-5); min-width: 0; outline: none; flex: 1; }
.page-head { display: flex; flex-wrap: wrap; gap: var(--space-3); justify-content: space-between; align-items: flex-end; margin-bottom: var(--space-4); }
.page-head h1 { font-size: var(--text-lg); font-weight: 600; letter-spacing: -0.02em; }
.page-head p { margin: 2px 0 0; color: var(--color-text-secondary); }
.back { display: inline-flex; align-items: center; gap: 2px; background: none; border: 0; color: var(--color-primary); padding: 0; font-weight: 500; margin-bottom: var(--space-2); font-size: var(--text-sm); }
.app-foot { max-width: var(--content-max); width: 100%; margin: 0 auto; padding: var(--space-4) var(--space-5) var(--space-5); font-size: var(--text-xs); color: var(--color-text-muted); display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); justify-content: space-between; }

/* Profile */
.profile-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-4); align-items: start; }
.profile-card-head { display: flex; gap: var(--space-4); align-items: center; padding: var(--space-5); border-bottom: 1px solid var(--color-border); }
.kv { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: var(--space-2) var(--space-4); padding: var(--space-4) var(--space-5); font-size: var(--text-sm); }
.kv dt { color: var(--color-text-muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.setting-row { display: flex; gap: var(--space-4); align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-5); border-top: 1px solid var(--color-border); flex-wrap: wrap; }
.setting-row:first-of-type { border-top: 0; }
.setting-row h3 { font-size: var(--text-sm); font-weight: 600; }
.setting-row p { margin: 2px 0 0; font-size: var(--text-sm); color: var(--color-text-secondary); }
.section-title { font-size: var(--text-base); font-weight: 600; padding: var(--space-4) var(--space-5) 0; }

/* ---------- Components ---------- */
.card, .glass-panel { background: var(--glass-card); -webkit-backdrop-filter: var(--glass-card-blur); backdrop-filter: var(--glass-card-blur); border: 1px solid var(--glass-border); border-radius: var(--radius-xl); box-shadow: var(--glass-highlight), var(--glass-card-shadow); transition: box-shadow 200ms; }
.card-pad { padding: var(--space-5); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 500; padding: 0 14px; height: 34px; border-radius: var(--radius-md); border: 1px solid transparent; white-space: nowrap; transition: background-color 120ms, border-color 120ms; }
.btn-sm { padding: 0 10px; height: 28px; font-size: var(--text-sm); }
.btn-lg { height: 42px; padding: 0 18px; font-size: 15px; }
.btn-primary { background: var(--color-primary); color: var(--color-inverse); box-shadow: var(--shadow-sm); }
.btn-primary:hover { background: var(--color-primary-hover); }
.btn-secondary { background: rgba(255, 255, 255, 0.9); color: var(--color-text); border-color: var(--color-border-input); }
.btn-secondary:hover { background: var(--color-surface-subtle); }
.btn-plain { background: none; color: var(--color-text-secondary); }
.btn-plain:hover { background: var(--color-surface-subtle); color: var(--color-text); }
.btn-danger { background: var(--color-surface); color: var(--color-danger); border-color: var(--color-danger); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-link { background: none; border: 0; color: var(--color-primary); font-weight: 500; padding: 0; }
.btn-block { width: 100%; }
.row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
.muted { color: var(--color-text-muted); }
.small { font-size: var(--text-sm); }
.xs { font-size: var(--text-xs); }
.code { font-family: var(--font-mono); font-size: var(--text-sm); }
.nowrap { white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.pill { display: inline-flex; align-items: center; gap: var(--space-1); padding: 1px var(--space-2); border-radius: 999px; font-size: var(--text-sm); font-weight: 500; white-space: nowrap; }
.pill .i { font-weight: 700; }
.pill-verified { background: var(--color-verified-bg); color: var(--color-verified-text); }
.pill-review { background: var(--color-review-bg); color: var(--color-review-text); }
.pill-missing { background: var(--color-missing-bg); color: var(--color-missing-text); }
.pill-passed { background: var(--color-passed-bg); color: var(--color-passed-text); }

.signal { display: inline-block; padding: 0 var(--space-2); border-radius: var(--radius-sm); font-size: var(--text-xs); font-weight: 600; letter-spacing: 0.04em; border: 1px solid var(--color-border-input); }
.signal-danger { background: var(--color-text); color: var(--color-inverse); border-color: var(--color-text); }
.picto { display: inline-flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--color-text-secondary); margin-right: var(--space-2); white-space: nowrap; }
.picto-diamond { width: 16px; height: 16px; transform: rotate(45deg); border: 2px solid var(--color-missing-icon); background: var(--color-surface); flex: none; display: grid; place-items: center; }
.picto-diamond span { transform: rotate(-45deg); font-size: 7px; font-weight: 700; color: var(--color-text); }

/* Segmented control (replaces underline tabs) */
.segmented { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: rgba(15, 23, 42, 0.06); border-radius: 9px; margin-bottom: var(--space-4); max-width: 100%; }
.segmented button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; border-radius: 7px; padding: 4px 12px; font-size: var(--text-sm); font-weight: 500; color: var(--color-text-secondary); }

/* Build field list + page text for a product, so quotes always exist on the page. */
function buildFromProduct(p) {
  const pages = { 1: [], 2: [], 3: [], 4: [] };
  const fields = [];
  const add = (f) => fields.push(Object.assign({ status: "passed" }, f));
  pages[1].push("SAFETY DATA SHEET", "according to GHS", "", "#SECTION 1: Identification");
  const qn = `Product name: ${p.name}`, qs = `Supplier: ${p.supplier}`;
  pages[1].push(qn, qs);
  add({ group: "Identification", key: "name", label: "Product name", value: p.name, page: 1, quote: qn });
  add({ group: "Identification", key: "supplier", label: "Supplier", value: p.supplier, page: 1, quote: qs });
  if (p.rev) {
    const qr = `Revision date: ${dotDate(p.rev)}`;
    pages[1].push(qr);
    add({ group: "Identification", key: "rev", label: "Revision date", value: p.rev, page: 1, quote: qr, edited: p.editedRev });
  } else {
    add({ group: "Identification", key: "rev", label: "Revision date", value: null, page: null, quote: null, status: "review", reason: "Not found in this SDS.", input: "date" });
  }
  pages[2].push("#SECTION 2: Hazard identification");
  if (p.emptyHazards) {
    pages[2].push("");
    add({ group: "Hazards", key: "h", label: "H code", value: null, page: 2, quote: null, status: "review", reason: "Section 2 looks empty. Please check the hazards.", input: "h" });
  } else {
    const qsw = p.signal ? `Signal word: ${p.signal}` : "Not classified as hazardous according to GHS.";
    pages[2].push(qsw);
    add({ group: "Hazards", key: "signal", label: "Signal word", value: p.signal || "Not classified", page: 2, quote: qsw });
    if (p.h.length) pages[2].push("Hazard statements:");
    p.h.forEach(code => { const q = `${code} ${H_TEXT[code]}`; pages[2].push(q); add({ group: "Hazards", key: "h", label: "H code", value: code, page: 2, quote: q }); });
    p.picto.forEach(code => { const q = `Pictogram: ${code}`; pages[2].push(q); add({ group: "Hazards", key: "picto", label: "Pictogram", value: code, page: 2, quote: q }); });
  }
  pages[3].push("#SECTION 3: Composition");
  p.ingredients.forEach((ing, i) => {
    const q = ing.cas ? `${ing.name}   CAS ${ing.cas}   ${ing.pct}` : `${ing.name.replace(" (trade secret)", "")}   CAS: not disclosed (trade secret)   ${ing.pct}`;
    pages[3].push(q);
    const short = ing.name.replace(" (trade secret)", "");
    add(ing.cas
      ? { group: "Composition", key: `cas:${i}`, label: `CAS · ${short}`, value: ing.cas, page: 3, quote: q }
      : { group: "Composition", key: `cas:${i}`, label: `CAS · ${short}`, value: null, page: 3, quote: "CAS: not disclosed (trade secret)", status: "missing", reason: "Not disclosed in this SDS." });
  });
  pages[4].push("#SECTION 7: Handling and storage", p.storage || "");
  add(p.storage ? { group: "Handling and storage", key: "storage", label: "Storage", value: p.storage, page: 4, quote: p.storage }
                : { group: "Handling and storage", key: "storage", label: "Storage", value: null, page: null, quote: null, status: "missing", reason: "Not found in this SDS." });
  if (p.missingSections && p.missingSections.includes("8")) {
    pages[4].push("", "#SECTION 10: Stability and reactivity", "Stable under normal conditions.");
    add({ group: "Exposure controls", key: "ppe", label: "PPE", value: null, page: null, quote: null, status: "missing", reason: "Section 8 not found in this SDS." });
  } else {
    const qp = `PPE: ${p.ppe}`;
    pages[4].push("", "#SECTION 8: Exposure controls / personal protection", qp);
    add({ group: "Exposure controls", key: "ppe", label: "PPE", value: p.ppe, page: 4, quote: qp });
  }
  return { pages, fields };
}

/* ---------- Derived data ---------- */
function flagsFor(p) {
  const out = [];
  if (p.rev && ageYears(p.rev) > state.settings.maxAge)
    out.push({ type: "old", label: "SDS too old", detail: `Revision date ${fmtDate(p.rev)}, ${ageText(p.rev)}` });
  const noCas = p.ingredients.filter(i => !i.cas).length;
  if (noCas) out.push({ type: "cas", label: "Missing CAS", detail: `${noCas} of ${p.ingredients.length} ingredient${p.ingredients.length === 1 ? "" : "s"} ${noCas === 1 ? "has" : "have"} no CAS number` });
  if (p.missingSections && p.missingSections.length)
    out.push({ type: "sections", label: "Missing sections", detail: `Section${p.missingSections.length > 1 ? "s" : ""} ${p.missingSections.join(" and ")} not found` });
  return out;
}
function allFlags() {
  const rows = [];
  state.products.forEach(p => flagsFor(p).forEach(f => rows.push(Object.assign({ product: p }, f))));
  state.docs.filter(d => d.status === "failed").forEach(d => rows.push({ type: "unreadable", label: "Unreadable file", detail: "Could not read text from this file", doc: d }));
  return rows;
}
function productStatus(p) {
  if (p.reopened) return { kind: "review", label: "Needs review" };
  const f = flagsFor(p);
  return f.length ? { kind: "review", label: `Needs action: ${f[0].label}` } : { kind: "verified", label: "Verified" };
}
function reviewCount(review) { return review.fields.filter(f => f.status === "review" && !f.resolution).length; }
function docsToReview() { return state.docs.filter(d => d.status === "review"); }

const APP_ROUTES = ["upload", "documents", "inventory", "action", "settings", "profile"];
/* Anything that touches your own files or facility needs an account. The sample workspace is public. */
const NEEDS_ACCOUNT = ["upload", "settings", "profile"];
const HASH_FOR = { documents: "review" };
const ROUTE_FOR = { review: "documents" };

function currentUser() { return state.auth ? state.auth.name : "you"; }
function initials(name) { return name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join(""); }

function go(name, extra) {
  if (NEEDS_ACCOUNT.includes(name) && !state.auth) { openAuth("signin", name); return; }
  state.route = Object.assign({ name }, extra || {});
  state.menuOpen = false;
  state.mobileMenuOpen = false;
  try {
    if (name === "landing") history.replaceState(null, "", location.pathname + location.search);
    else if (APP_ROUTES.includes(name)) history.replaceState(null, "", "#" + (HASH_FOR[name] || name));
  } catch (e) { /* the frame may refuse; state still works */ }
  if (name === "review") state.review = { active: firstOpenIndex(state.reviews[extra.reviewKey]), editing: null, editError: "" };
  if (name === "product") state.record = { active: 0 };
  render();
  const focusTarget = name === "landing" ? document.getElementById("landing") : document.getElementById("main");
  focusTarget && focusTarget.focus && focusTarget.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}
function firstOpenIndex(review) {
  const order = orderedFields(review);
  const i = order.findIndex(f => f.status === "review" && !f.resolution);
  return review.fields.indexOf(order[i >= 0 ? i : 0]);
}

const STAGES = ["Queued", "Reading pages", "Finding sections", "Extracting", "Checking", "Ready for review"];
function startProcessing(doc) {
  doc.status = "processing"; doc.stage = 0; doc.waiting = false;
  const t = setInterval(() => {
    if (doc.waitAt === doc.stage && !doc.waited) { doc.waiting = true; doc.waited = true; render(); return; }
    doc.waiting = false;
    doc.stage++;
    if (doc.outcome === "failed" && doc.stage >= 2) {
      clearInterval(t); doc.status = "failed"; doc.reason = "Could not read text from this file. It may be a poor scan or password protected.";
      toast(`Could not read ${doc.file}. It is listed under Actions.`, true);
    } else if (doc.stage >= STAGES.length - 1) {
      clearInterval(t); doc.status = "review";
      const key = "r" + doc.id; state.reviews[key] = templateReview(doc.file.replace(/ SDS\.pdf$/i, "").replace(/\.pdf$/i, "")); doc.reviewKey = key;
    }
    render();
  }, 900);
  state.timers.push(t);
}

function docRow(d) {

/* ---------- S3 Review SDS ---------- */
const GROUP_ORDER = ["Identification", "Hazards", "Composition", "Handling and storage", "Exposure controls"];
function orderedFields(review) {
  const rank = f => f.status === "review" && !f.resolution ? 0 : f.status === "missing" || f.resolution === "missing" ? 1 : 2;
  return review.fields.slice().sort((a, b) => rank(a) - rank(b) || GROUP_ORDER.indexOf(a.group) - GROUP_ORDER.indexOf(b.group));
}
function renderReview() {
  const key = state.route.reviewKey, r = state.reviews[key];
  const open = reviewCount(r);
  const missing = r.fields.filter(f => f.status === "missing" || f.resolution === "missing").length;
  const passed = r.fields.length - open - missing;
  const sections = [
    { title: `Needs review (${open})`, items: r.fields.filter(f => f.status === "review" && !f.resolution) },
    { title: `Missing (${missing})`, items: r.fields.filter(f => f.status === "missing" || f.resolution === "missing") },
    { title: `Resolved and passed checks (${passed})`, items: r.fields.filter(f => (f.status === "passed" || (f.resolution && f.resolution !== "missing"))) }
  ];
  const ready = open === 0;
  const headline = r.fields.every(f => f.status !== "review") && !r.fields.some(f => f.resolution)
    ? `All checks passed on ${passed} fields. Look over them, then approve.`
    : ready ? "All doubtful fields are resolved. Approve product to add it to your inventory." : `${open} field${open === 1 ? "" : "s"} need${open === 1 ? "s" : ""} review · ${passed} passed checks · ${missing} missing`;
  const approveBtn = `<button class="btn btn-primary" id="approve-product" ${ready ? "" : "disabled"} title="${ready ? "" : `Resolve the ${open} field${open === 1 ? "" : "s"} that need review first.`}">Approve product</button>`;
  const active = r.fields[state.review.active];
  const doc = state.docs.find(d => d.reviewKey === key);
  r.file = doc ? doc.file : "";
  return `<button class="back" data-nav="documents">${icon("chevron")}Review</button>` +
    pageHead(`${esc(r.product.name)} · <span class="muted" style="font-weight:400">${esc(r.product.supplier)}</span>`, headline, approveBtn) + `
    <div class="split">
      <div class="fields">
        ${sections.filter(s => s.items.length).map(s => `<div><div class="group-title"><span>${s.title}</span></div>
          <div class="card">${s.items.map(f => fieldRow(r, f, true)).join("")}</div></div>`).join("")}
        <p class="xs muted">Keyboard: <span class="kbd">A</span> approve · <span class="kbd">E</span> edit · <span class="kbd">M</span> not in SDS · <span class="kbd">J</span>/<span class="kbd">K</span> next/previous field</p>
      </div>
      ${viewer(r, active, "review")}
    </div>`;
}
function fieldStatusPill(f) {
  if (f.resolution === "approved") return pill("passed", "Approved");
  if (f.resolution === "edited") return pill("passed", "Edited");
  if (f.resolution === "missing" || f.status === "missing") return pill("missing", "Missing");
  if (f.status === "review") return pill("review", "Needs review");
  return pill("passed", "Passed checks");
}
function displayValue(f) {
  if (f.value == null || f.resolution === "missing") return `<span class="muted">—</span>`;
  if (f.key === "rev") return fmtDate(f.value);
  if (f.key === "h") return `<span class="code">${esc(f.value)}</span> ${esc(H_TEXT[f.value] || "")}`;
  if (f.key.startsWith("cas")) return `<span class="code">${esc(f.value)}</span>`;
  if (f.key === "picto") return pictoBadge(f.value);
  if (f.key === "signal") return f.value === "Not classified" ? "Not classified" : signalBadge(f.value);
  return esc(f.value);
}
function fieldRow(r, f, editable) {
  const idx = r.fields.indexOf(f);
  const isActive = idx === (editable ? state.review.active : state.record.active);
  const open = f.status === "review" && !f.resolution;
  let body = "";
  if (editable && state.review.editing === idx) {
    const type = f.input === "date" ? "date" : "text";
    const val = f.input === "date" ? (f.value || "") : (f.value || "");
    body = `<form class="field-actions" data-editform="${idx}" style="flex-direction:column;align-items:stretch">
      <label class="field-label-sm" for="edit-input">Correct value${f.input === "cas" ? " (CAS number, for example 7732-18-5)" : f.input === "h" ? " (for example H319)" : ""}</label>
      <input class="input" id="edit-input" type="${type}" value="${esc(val)}" autocomplete="off">
      ${state.review.editError ? `<div class="error-text">${esc(state.review.editError)}</div>` : ""}
      <div class="row"><button class="btn btn-primary btn-sm" type="submit">Save</button><button class="btn btn-secondary btn-sm" type="button" data-canceledit>Cancel</button></div></form>`;
  } else if (editable && open) {
    body = `<div class="field-actions"><button class="btn btn-secondary btn-sm" data-act="approve" data-idx="${idx}">Approve</button>
      <button class="btn btn-secondary btn-sm" data-act="edit" data-idx="${idx}">Edit</button>
      <button class="btn btn-secondary btn-sm" data-act="missing" data-idx="${idx}">Not in SDS</button></div>`;
  }
  const reason = open ? `<div class="reason reason-review">${esc(f.reason)}</div>`
    : (f.status === "missing" && !f.resolution) ? `<div class="reason reason-missing">${esc(f.reason)}</div>`
    : f.resolution === "edited" ? `<div class="resolved">Edited by ${esc(currentUser())}</div>`
    : f.resolution === "missing" ? `<div class="reason reason-missing">Marked as missing by ${esc(currentUser())}</div>`
    : f.resolution === "approved" ? `<div class="resolved">Approved by ${esc(currentUser())}</div>` : "";
  return `<div class="field ${isActive ? "active" : ""}" data-field="${idx}" data-mode="${editable ? "review" : "record"}">
    <div class="field-top"><span class="field-label-sm">${esc(f.label)}${f.page ? ` · p.${f.page}` : ""}</span>${fieldStatusPill(f)}</div>
    <div class="field-value">${displayValue(f)}</div>${reason}${body}</div>`;
}
function viewer(r, f, mode) {
  const page = (f && f.page) || 1;
  const total = Object.keys(r.pages).length;
  const lines = r.pages[page] || [];
  const quote = f && f.resolution !== "missing" ? f.quote : null;
  const html = lines.map(line => {
    if (line === "") return `<div class="blank"></div>`;
    if (line.startsWith("#")) return `<div class="ln sec">${esc(line.slice(1))}</div>`;
    if (quote && line.includes(quote)) {
      const i = line.indexOf(quote);
      return `<div class="ln">${esc(line.slice(0, i))}<mark class="q">${esc(quote)}</mark>${esc(line.slice(i + quote.length))}</div>`;
    }
    return `<div class="ln">${esc(line)}</div>`;
  }).join("");
  const note = f && f.aiQuote && !f.resolution ? `<div class="ai-note">The AI quoted “${esc(f.aiQuote)}”, but that text is not on any page, so the value was removed. Look for the revision date on this page.</div>`
    : f && !f.page ? `<div class="ai-note">This value has no source page in the SDS.</div>` : "";
  return `<section class="card viewer" aria-label="Source PDF">
    <div class="viewer-bar"><span>${r.file ? esc(r.file) + " · " : ""}Page ${page} of ${total}</span>
      <span class="row"><button class="btn btn-secondary btn-sm" data-page="${page - 1}" data-pmode="${mode}" ${page <= 1 ? "disabled" : ""} aria-label="Previous page">‹</button>
      <button class="btn btn-secondary btn-sm" data-page="${page + 1}" data-pmode="${mode}" ${page >= total ? "disabled" : ""} aria-label="Next page">›</button></span></div>
    ${note}
    <div class="desk"><div class="paper">${html}</div></div></section>`;
}
function resolveField(idx, how) {
  const r = state.reviews[state.route.reviewKey], f = r.fields[idx];
  if (!(f.status === "review" && !f.resolution)) return;
  if (how === "approve" && f.value == null) { toast("There is no value to approve. Use Edit to enter it, or Not in SDS.", true); return; }
  if (how === "approve" && f.input === "h" && !hCodeValid(f.value)) { toast("This value fails the H code check. Use Edit to correct it.", true); return; }
  if (how === "approve" && f.input === "cas" && !casValid(f.value)) { toast("This CAS number fails the check digit. Use Edit to correct it.", true); return; }
  if (how === "edit") { state.review.editing = idx; state.review.active = idx; state.review.editError = ""; render(); const el = document.getElementById("edit-input"); el && el.focus(); return; }
  f.resolution = how === "approve" ? "approved" : "missing";
  moveToNextOpen(r);
  render();
}
function saveEdit(idx, raw) {
  const r = state.reviews[state.route.reviewKey], f = r.fields[idx];
  const v = (raw || "").trim();
  let err = "";
  if (!v) err = "Enter a value, or cancel and use Not in SDS.";
  else if (f.input === "cas" && !casValid(v)) err = "CAS check digit is wrong. Check the number in the SDS.";
  else if (f.input === "h" && !hCodeValid(v)) err = "This is not a valid H code format (H plus 3 digits).";
  else if (f.input === "h" && !H_TEXT[v]) err = "Prototype only knows a few H codes. Try H319.";
  if (err) { state.review.editError = err; render(); const el = document.getElementById("edit-input"); el && (el.value = v, el.focus()); return; }
  f.value = v; f.resolution = "edited"; state.review.editing = null; state.review.editError = "";
  moveToNextOpen(r); render();
}
function moveToNextOpen(r) {
  const i = r.fields.findIndex(f => f.status === "review" && !f.resolution);
  if (i >= 0) state.review.active = i;
}
function approveProduct() {
  const key = state.route.reviewKey, r = state.reviews[key];
  if (reviewCount(r)) return;
  const p = clone(r.product);
  p.h = []; p.picto = [];
  r.fields.forEach(f => {
    const val = f.resolution === "missing" || f.value == null ? null : f.value;
    if (f.key === "h") { if (val) p.h.push(val); }
    else if (f.key === "picto") { if (val) p.picto.push(val); }
    else if (f.key.startsWith("cas:")) { p.ingredients[Number(f.key.split(":")[1])].cas = val; }
    else if (f.key === "signal") p.signal = val === "Not classified" ? null : val;
    else p[f.key] = val;
  });
  const doc = state.docs.find(d => d.reviewKey === key);
  p.emptyHazards = false; p.reopened = false;
  p.file = doc.file; p.approvedBy = state.auth ? state.auth.name : "Sample user"; p.approvedAt = "2026-10-09";
  if (r.productId) { p.id = r.productId; state.products = state.products.map(x => x.id === p.id ? p : x); }
  else { p.id = "p" + (state.nextId++); state.products.unshift(p); }
  state.docs = state.docs.filter(d => d !== doc);
  toast(`${p.name} added to inventory.`);
  const next = docsToReview()[0];
  if (next) { go("review", { reviewKey: next.reviewKey }); const n = reviewCount(state.reviews[next.reviewKey]); toast(`Next: ${state.reviews[next.reviewKey].product.name} (${n ? `${n} field${n === 1 ? "" : "s"} to review` : "nothing flagged, look over and approve"})`); }
  else go("documents");
}

/* ---------- S4 Inventory ---------- */
function renderInventory() {
  if (!state.products.length) return pageHead("Inventory", "Every approved chemical product in your facility.") +
    `<div class="card">${emptyState("Your inventory is empty", "Approve reviewed SDS files and they will appear here.", "Go to documents", "documents")}</div>`;
  const f = state.inv;
  const suppliers = [...new Set(state.products.map(p => p.supplier))].sort();
  const hazards = [...new Set(state.products.flatMap(p => p.h))].sort();
  const q = f.q.trim().toLowerCase();
  const rows = state.products.filter(p => {
    const hay = [p.name, p.supplier, ...p.h, ...p.ingredients.map(i => i.cas || "")].join(" ").toLowerCase();
    const st = productStatus(p).kind === "verified" ? "verified" : "action";
    return (!q || hay.includes(q)) && (!f.supplier || p.supplier === f.supplier) && (!f.hazard || p.h.includes(f.hazard)) && (!f.status || st === f.status);
  });
  const anyFilter = f.q || f.supplier || f.hazard || f.status;
  return pageHead("Inventory", `Every approved chemical product in your facility. <span class="num">${state.products.length}</span> products.`, `<button class="btn btn-primary" id="open-export">Export CIL</button>`) + `
    <div class="toolbar">
      <label class="sr-only" for="inv-q">Search</label>
      <input class="input input-search" id="inv-q" type="search" placeholder="Search name, supplier, CAS, H code" value="${esc(f.q)}" autocomplete="off">
      <select class="select" id="inv-supplier" aria-label="Supplier"><option value="">All suppliers</option>${suppliers.map(s => `<option ${f.supplier === s ? "selected" : ""}>${esc(s)}</option>`).join("")}</select>
      <select class="select" id="inv-hazard" aria-label="Hazard" style="width:280px"><option value="">All hazards</option>${hazards.map(h => `<option value="${h}" ${f.hazard === h ? "selected" : ""}>${h} ${esc(H_TEXT[h])}</option>`).join("")}</select>
      <select class="select" id="inv-status" aria-label="Status"><option value="">All statuses</option><option value="verified" ${f.status === "verified" ? "selected" : ""}>Verified</option><option value="action" ${f.status === "action" ? "selected" : ""}>Needs action</option></select>
      ${anyFilter ? `<button class="btn-link" id="clear-filters">Clear filters</button>` : ""}
    </div>
    <p class="small muted" style="margin:0 0 var(--space-2)">Showing <span class="num">${rows.length}</span> of <span class="num">${state.products.length}</span> products</p>
    <div class="card">${rows.length ? `<div class="table-wrap"><table class="data"><thead><tr><th>Product</th><th>Supplier</th><th>Signal word</th><th>H codes</th><th>Pictograms</th><th>SDS date</th><th>Status</th></tr></thead><tbody>
      ${rows.map(p => { const s = productStatus(p); return `<tr class="clickable" data-product="${p.id}" tabindex="0"><td><strong style="font-weight:500">${esc(p.name)}</strong></td><td>${esc(p.supplier)}</td><td>${signalBadge(p.signal)}</td>
        <td class="code nowrap">${p.h.length ? p.h.join(" ") : `<span class="muted" style="font-family:var(--font-sans)">Not classified</span>`}</td><td class="nowrap">${p.picto.map(c => `<span title="${c} ${PICTO[c]}" class="picto">${`<span class="picto-diamond" aria-hidden="true"><span>${c.slice(3)}</span></span>`}${c}</span>`).join("") || `<span class="muted">—</span>`}</td>
        <td class="nowrap num">${fmtDate(p.rev)}</td><td>${pill(s.kind, s.label)}</td></tr>`; }).join("")}</tbody></table></div>`
      : `<div class="empty"><p>No products match your search.</p><button class="btn btn-secondary" id="clear-filters">Clear filters to see all ${state.products.length} products</button></div>`}</div>${FOOTER}`;
}

/* ---------- S5 Product record ---------- */
function renderProduct() {
  const p = state.products.find(x => x.id === state.route.productId);
  if (!p) return emptyState("Could not load this product", "Go back to the inventory and try again.", "Back to inventory", "inventory");
  const built = buildFromProduct(p); built.file = p.file;
  const f = built.fields[state.record.active];
  const s = productStatus(p);
  return `<button class="back" data-nav="inventory">${icon("chevron")}Inventory</button>` +
    pageHead(`${esc(p.name)} · <span class="muted" style="font-weight:400">${esc(p.supplier)}</span>`,
      `Approved by ${esc(p.approvedBy)} on ${fmtDate(p.approvedAt)} · SDS revision date ${fmtDate(p.rev)} · Source: ${esc(p.file)}`,
      `<button class="btn btn-secondary" data-nav="upload">Upload newer SDS</button><button class="btn btn-secondary" id="reopen" ${p.reopened ? "disabled" : ""}>Reopen review</button>`) + `
    <div class="summary-strip" style="margin:-8px 0 var(--space-4)">${pill(s.kind, s.label)}${flagsFor(p).slice(1).map(x => pill("review", x.label)).join("")}${p.note ? `<span class="small muted">Note: ${esc(p.note)}</span>` : ""}</div>
    <div class="split split-record">
      <div class="card"><div class="table-wrap"><table class="data"><thead><tr><th>Field</th><th>Value</th><th class="num">Page</th><th>Check</th><th>Status</th></tr></thead><tbody>
      ${built.fields.map((x, i) => `<tr class="clickable ${i === state.record.active ? "selected" : ""}" data-recfield="${i}" tabindex="0">
        <td class="nowrap">${esc(x.label)}</td><td>${displayValue(x)}</td><td class="num">${x.page || "—"}</td><td class="small nowrap">${checkLabel(x)}</td>
        <td>${x.status === "missing" ? pill("missing", "Missing") : pill("verified", x.edited ? "Verified · edited" : "Verified")}</td></tr>`).join("")}

function checkLabel(f) {
  if (f.status === "missing") return `<span class="muted">—</span>`;
  if (f.key.startsWith("cas")) return "Quote found · check digit OK";
  if (f.key === "h") return "Quote found · format OK";
  if (f.key === "rev") return "Quote found · date OK";
  return "Quote found";
}

/* ---------- S6 Needs action ---------- */

/* ---------- Dialogs and toasts ---------- */
let lastFocus = null;
function showDialog(html, cls) {
  lastFocus = document.activeElement;
  const root = document.getElementById("dialog-root");
  root.innerHTML = `<div class="overlay" data-overlay><div class="dialog ${cls || ""}" role="dialog" aria-modal="true" aria-labelledby="dlg-title">${html}</div></div>`;
  const first = root.querySelector("input, select, textarea, button.btn-primary, button");
  first && first.focus();
}
function closeDialog() { document.getElementById("dialog-root").innerHTML = ""; lastFocus && lastFocus.focus && lastFocus.focus(); }
function confirmDialog(title, text, okLabel, danger, onOk) {
  showDialog(`<div class="dialog-head"><h2 id="dlg-title">${title}</h2></div><div class="dialog-body"><p style="margin:0">${text}</p></div>
    <div class="dialog-foot"><button class="btn btn-secondary" data-close>Cancel</button><button class="btn ${danger ? "btn-danger" : "btn-primary"}" id="dlg-ok">${okLabel}</button></div>`);
  document.getElementById("dlg-ok").onclick = () => { closeDialog(); onOk(); };
}
function noteDialog(p) {
  showDialog(`<div class="dialog-head"><h2 id="dlg-title">Note for ${esc(p.name)}</h2></div>
    <div class="dialog-body"><div><label class="field-label" for="note-text">Note</label><textarea class="input" id="note-text" rows="3" style="width:100%" placeholder="For example: supplier says CAS is a trade secret, asked on 9 Oct">${esc(p.note || "")}</textarea>
    <div class="help">Kept with this flag for your auditor. The flag stays open.</div></div></div>
    <div class="dialog-foot"><button class="btn btn-secondary" data-close>Cancel</button><button class="btn btn-primary" id="dlg-ok">Save note</button></div>`);
  document.getElementById("dlg-ok").onclick = () => { p.note = document.getElementById("note-text").value.trim(); closeDialog(); toast("Note saved."); render(); };
}
function toast(msg, isError) {
  const el = document.createElement("div");
  el.className = "toast" + (isError ? " toast-error" : "");
  el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => el.remove(), isError ? 7000 : 5000);
}

/* ---------- Render + events ---------- */
function render() {
  const r = state.route.name;
  const landing = document.getElementById("landing"), app = document.getElementById("app");
  if (r === "landing") {
    landing.hidden = false; app.hidden = true;
    landing.innerHTML = renderLanding();
    return;
  }
  landing.hidden = true; app.hidden = false; landing.innerHTML = "";
  renderShell();
  const html = r === "upload" ? renderUpload() : r === "documents" ? renderDocuments() : r === "review" ? renderReview()
    : r === "product" ? renderProduct() : r === "action" ? renderAction() : r === "settings" ? renderSettings() : r === "profile" ? renderProfile() : renderInventory();
  const main = document.getElementById("main");
  const focusId = document.activeElement && document.activeElement.id;
  const caret = document.activeElement && document.activeElement.selectionStart;
  main.innerHTML = html;
  if (focusId && ["inv-q"].includes(focusId)) { const el = document.getElementById(focusId); el.focus(); try { el.setSelectionRange(caret, caret); } catch (e) {} }
  bindScreen();
}
function bindScreen() {
  const dz = document.getElementById("dropzone");
  if (dz) {
    const input = document.getElementById("file-input");
    document.getElementById("choose").onclick = () => input.click();
    input.onchange = () => addFiles(input.files);
    document.getElementById("sample-batch").onclick = sampleBatch;
    ["dragenter", "dragover"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add("dragging"); }));
    ["dragleave", "drop"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove("dragging"); }));
    dz.addEventListener("drop", e => addFiles(e.dataTransfer.files));
  }
  const q = document.getElementById("inv-q");
  if (q) {
    q.oninput = () => { state.inv.q = q.value; render(); };
    document.getElementById("inv-supplier").onchange = e => { state.inv.supplier = e.target.value; render(); };
    document.getElementById("inv-hazard").onchange = e => { state.inv.hazard = e.target.value; render(); };
    document.getElementById("inv-status").onchange = e => { state.inv.status = e.target.value; render(); };
  }
  const sf = document.getElementById("settings-form");
  if (sf) sf.onsubmit = e => {
    e.preventDefault();
    const age = Number(document.getElementById("set-age").value);
    const err = document.getElementById("age-error");
    if (!Number.isInteger(age) || age < 1 || age > 10) { err.hidden = false; document.getElementById("set-age").focus(); return; }
    err.hidden = true;
    Object.assign(state.settings, { facility: document.getElementById("set-facility").value.trim() || state.settings.facility,
      location: document.getElementById("set-location").value.trim(), provider: document.getElementById("set-provider").value.trim(), maxAge: age });
    toast("Settings saved. Action flags updated."); render();
  };
}

document.addEventListener("click", e => {
  const scrollLink = e.target.closest("[data-scroll]");
  if (scrollLink) { e.preventDefault(); const el = document.getElementById(scrollLink.dataset.scroll); el && el.scrollIntoView({ behavior: "smooth" }); return; }
  const t = e.target.closest("button, tr[data-product], tr[data-recfield], .field, [data-overlay]");
  if (!t) { if (state.menuOpen) { state.menuOpen = false; renderShell(); } return; }
  const d = t.dataset;
  if (d.overlay !== undefined && e.target === t) return closeDialog();
  if (d.close !== undefined) return closeDialog();
  if (t.id === "profile-btn") { state.menuOpen = !state.menuOpen; renderShell(); const first = document.querySelector(".menu [role=menuitem]"); first && first.focus(); return; }
  if (t.id === "menu-toggle") { state.mobileMenuOpen = !state.mobileMenuOpen; return renderShell(); }
  if (state.menuOpen && !t.closest(".menu")) { state.menuOpen = false; renderShell(); }
  if (t.id === "change-password") return passwordDialog();
  if (t.id === "signout-all") return confirmDialog("Sign out of all devices?", "Every session, including this one, will end. You will need to sign in again.", "Sign out everywhere", true, () => signOut("Signed out of all devices."));
  if (d.demoLogin !== undefined) return demoLogin(d.intent);
  if (d.signin !== undefined) return openAuth("signin", d.intent || (state.route.name === "landing" ? "inventory" : state.route.name));
  if (d.authmode) { const em = document.getElementById("a-email"); state.authMode = d.authmode; state.authErrors = {}; return renderAuth({ email: em ? em.value : "" }); }
  if (t.id === "sign-out") { closeDialog(); return signOut(); }
  if (d.explore !== undefined) return go("inventory");
  if (d.home !== undefined || t.id === "brand-home") return go(state.auth ? "inventory" : "landing");
  if (d.nav) { closeDialog(); return go(d.nav); }
  if (d.review) return go("review", { reviewKey: d.review });
  if (d.product) return go("product", { productId: d.product });
  if (d.docfilter) { state.docFilter = d.docfilter; return render(); }
  if (d.flagfilter) { state.flagFilter = d.flagfilter; return render(); }
  if (d.recfield) { state.record.active = Number(d.recfield); return render(); }
  if (d.act) { e.stopPropagation(); return resolveField(Number(d.idx), d.act); }
  if (d.canceledit !== undefined) { state.review.editing = null; state.review.editError = ""; return render(); }
  if (d.page && d.pmode) {
    const want = Number(d.page);
    if (d.pmode === "review") { const r = state.reviews[state.route.reviewKey]; const i = r.fields.findIndex(f => f.page === want); if (i >= 0) state.review.active = i; }
    else { const p = state.products.find(x => x.id === state.route.productId); const i = buildFromProduct(p).fields.findIndex(f => f.page === want); if (i >= 0) state.record.active = i; }
    return render();
  }
  if (d.retry) { const doc = state.docs.find(x => x.id === d.retry); doc.outcome = "failed"; doc.waitAt = -1; startProcessing(doc); toast(`Retrying ${doc.file}…`); return render(); }
  if (d.remove) {
    const doc = state.docs.find(x => x.id === d.remove);
    return confirmDialog("Remove this file?", `${esc(doc.file)} will be removed from ChemReady. This does not affect your inventory.`, "Remove file", true,
      () => { state.docs = state.docs.filter(x => x !== doc); toast("File removed."); render(); });
  }
  if (d.note) return noteDialog(state.products.find(x => x.id === d.note));
  if (t.id === "approve-product") return approveProduct();
  if (t.id === "open-export") return openExport();
  if (t.id === "do-export") return exportPreview();
  if (t.id === "clear-filters") { state.inv = { q: "", supplier: "", hazard: "", status: "" }; return render(); }
  if (t.id === "reset-demo") { closeDialog(); resetState(); toast("Demo reset."); return go("landing"); }
  if (t.id === "reopen") {
    const p = state.products.find(x => x.id === state.route.productId);
    return confirmDialog("Reopen review?", "This product stays in the inventory but shows Needs review until you approve it again.", "Reopen review", false, () => {
      p.reopened = true;
      const key = "reopen-" + p.id;
      state.reviews[key] = Object.assign({ product: clone(p), productId: p.id }, buildFromProduct(p));
      state.docs.unshift({ id: "d" + (state.nextId++), file: p.file, status: "review", uploaded: "2026-10-09", reviewKey: key });
      toast("Review reopened. It is waiting in Review."); render();
    });
  }
  if (t.classList.contains("field") && d.mode === "review") {
    if (e.target.closest("form, input")) return;
    state.review.active = Number(d.field); return render();
  }
});
document.addEventListener("submit", e => {
  if (e.target.id === "profile-form") {
    e.preventDefault();
    const name = document.getElementById("p-name").value.trim();
    const err = document.getElementById("p-name-error");
    if (!name) { err.hidden = false; document.getElementById("p-name").focus(); return; }
    err.hidden = true;
    state.products.forEach(p => { if (p.approvedBy === state.auth.name) p.approvedBy = name; });
    state.auth.name = name; state.auth.role = document.getElementById("p-role").value.trim();
    toast("Profile saved."); return render();
  }
  if (e.target.id === "pw-form") {
    e.preventDefault();
    const help = document.getElementById("pw-help");
    if (!document.getElementById("pw-current").value) { help.textContent = "Enter your current password."; help.className = "error-text"; return; }
    if (document.getElementById("pw-new").value.length < 8) { help.textContent = "Use at least 8 characters."; help.className = "error-text"; return; }
    closeDialog(); toast("Password updated. Other devices were signed out."); return;
  }
  const auth = e.target.closest("[data-authform]");
  if (auth) { e.preventDefault(); return submitAuth(auth.dataset.authform); }
  const form = e.target.closest("[data-editform]");
  if (!form) return;
  e.preventDefault();
  saveEdit(Number(form.dataset.editform), document.getElementById("edit-input").value);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.getElementById("dialog-root").innerHTML) return closeDialog();
  if (e.key === "Escape" && (state.menuOpen || state.mobileMenuOpen)) { state.menuOpen = false; state.mobileMenuOpen = false; renderShell(); const b = document.getElementById("profile-btn"); b && b.focus(); return; }
  const tr = e.target.closest && e.target.closest("tr[data-product], tr[data-recfield]");
  if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); tr.click(); return; }
  if (state.route.name !== "review" || document.getElementById("dialog-root").innerHTML) return;
  if (["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  const r = state.reviews[state.route.reviewKey];
  const order = orderedFields(r).map(f => r.fields.indexOf(f));
  const pos = order.indexOf(state.review.active);
  const k = e.key.toLowerCase();
  if (k === "j" || k === "k") { const n = order[Math.min(order.length - 1, Math.max(0, pos + (k === "j" ? 1 : -1)))]; state.review.active = n; render(); }
  else if (k === "a") resolveField(state.review.active, "approve");
  else if (k === "e") resolveField(state.review.active, "edit");
  else if (k === "m") resolveField(state.review.active, "missing");
  else return;
  e.preventDefault();
});

resetState();
const rawHash = (location.hash || "").slice(1);
if (rawHash === "demo" || rawHash === "app") state.auth = { name: DEMO.name, email: DEMO.email, demo: true };
const startHash = rawHash === "demo" || rawHash === "app" ? "inventory" : ROUTE_FOR[rawHash] || rawHash;
go(APP_ROUTES.includes(startHash) && (state.auth || !NEEDS_ACCOUNT.includes(startHash)) ? startHash : "landing");
</script>
