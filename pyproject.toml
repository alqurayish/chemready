[project]
name = "chemready"
version = "0.1.0"
description = "Turns chemical safety data sheets into a verified, audit ready chemical inventory."
readme = "README.md"
license = "MIT"
authors = [{ name = "Md. Alqurayish Sharkar" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "google-genai>=1.0",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "pymupdf>=1.25",
]

[project.scripts]
chemready = "chemready.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemready"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W style, F real bugs, I import order, B likely bugs, UP modern syntax,
# SIM simpler code, N naming, S security, RUF ruff's own checks.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks results; it is fine in tests.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

# PyMuPDF's type hints are incomplete. Treat it as untyped; our own wrappers in
# chemready.pdf are fully typed, so the rest of the code stays strictly checked.
[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["chemready"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = ['if __name__ == "__main__":']
