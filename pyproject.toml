[project]
name = "chemready"
version = "0.1.0"
description = "Turns chemical safety data sheets into a verified, audit ready chemical inventory."
readme = "README.md"
license = "MIT"
authors = [{ name = "Md. Alqurayish Sharkar" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic-settings>=2.6",
]

[project.scripts]
chemready = "chemready.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemready"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W style, F real bugs, I import order, B likely bugs, UP modern syntax,
# SIM simpler code, N naming, S security, RUF ruff's own checks.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks results; it is fine in tests.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
